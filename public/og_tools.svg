<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f3a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Top accent line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#10b981" stroke-width="3"/>
  
  <!-- Decorative blurred circles in background -->
  <circle cx="150" cy="100" r="120" fill="#10b981" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1050" cy="550" r="140" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="600" r="100" fill="#a855f7" opacity="0.06" filter="url(#glow)"/>
  
  <!-- Left bracket -->
  <g stroke="#10b981" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M 120 180 L 80 180 L 80 450 L 120 450" stroke-width="7"/>
  </g>
  
  <!-- Right bracket -->
  <g stroke="#06b6d4" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M 1080 180 L 1120 180 L 1120 450 L 1080 450" stroke-width="7"/>
  </g>
  
  <!-- Code symbols - Left side -->
  <g fill="#10b981" opacity="0.6">
    <text x="180" y="220" font-family="monospace" font-size="32" font-weight="bold">{</text>
    <text x="550" y="240" font-family="monospace" font-size="24" font-weight="bold" fill="#06b6d4" opacity="0.5">{">"}</text>
  </g>
  
  <!-- Code symbols - Right side -->
  <g fill="#a855f7" opacity="0.6">
    <text x="950" y="400" font-family="monospace" font-size="32" font-weight="bold">}</text>
    <text x="650" y="380" font-family="monospace" font-size="24" font-weight="bold" fill="#10b981" opacity="0.5">{"<"}</text>
  </g>
  
  <!-- Main heading -->
  <text x="600" y="240" font-family="Plus Jakarta Sans, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="-1">
    <tspan fill="#10b981">DEV</tspan><tspan fill="white"> TOOLS</tspan>
  </text>
  
  <!-- Subheading -->
  <text x="600" y="320" font-family="Inter, sans-serif" font-size="32" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
    Free, Fast, Browser-Based Utilities
  </text>
  
  <!-- Feature tags -->
  <g font-family="Inter, sans-serif" font-size="16" font-weight="500">
    <!-- Tag 1 -->
    <rect x="280" y="400" width="160" height="40" rx="20" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="360" y="425" text-anchor="middle" fill="#10b981">Base64 • UUID</text>
    
    <!-- Tag 2 -->
    <rect x="520" y="400" width="160" height="40" rx="20" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <text x="600" y="425" text-anchor="middle" fill="#06b6d4">JSON • Hash</text>
    
    <!-- Tag 3 -->
    <rect x="760" y="400" width="160" height="40" rx="20" fill="none" stroke="#a855f7" stroke-width="2"/>
    <text x="840" y="425" text-anchor="middle" fill="#a855f7">JWT • Color</text>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="0" y1="630" x2="1200" y2="630" stroke="#a855f7" stroke-width="3"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.3"/>
</svg>
